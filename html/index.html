<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Web Stranica</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div id="tabs">
                <button id="page1Btn" class="tab active">Kocka</button>
                <button id="page2Btn" class="tab">Stožac</button>
            </div>
            <div id="modes">
                <button id="fontSizeBtn">
                    <img src="/icons/biggerletters.png" width="24" height="24" alt="Slova" title="Veličina slova"/>
                </button>
                <button id="fontStyleBtn">
                    <img src="/icons/letter-a (1).png" width="24" height="24" alt="Disleksija" title="Prilagodba disleksiji"/>
                </button>
                <button id="darkModeBtn">
                    <img src="/icons/contrast.png" width="24" height="24" alt="Tema" title="Prilagodba svjetline"/>
                </button>
            </div>
        </nav>
        
    </header>
    
    <main id="main-content">
        <!-- Dinamički sadržaj će se učitavati ovdje -->
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
